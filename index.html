<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prototipo App de Barbería</title>
    <!-- Carga de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Carga de la fuente Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Estilo para el día actual en el calendario */
        .today {
            background-color: #3b82f6 !important; /* blue-500 */
            color: white !important;
            border-radius: 50%;
        }
        /* Estilo para días con citas */
        .has-appointment {
            position: relative;
        }
        .has-appointment::after {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background-color: #ef4444; /* red-500 */
        }
        /* Estilos para botones de acción */
        .action-btn {
            transition: all 0.15s ease-in-out;
        }
        .action-btn:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body class="bg-gray-100">

    <!-- Contenedor principal de la "app" móvil -->
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg">

        <!-- Cabecera -->
        <!-- AÑADIDO: 'relative' -->
        <header class="bg-gray-800 text-white p-4 shadow-md sticky top-0 z-10 relative">
            <!-- Reloj en la esquina superior derecha -->
            <div id="current-time-clock" class="absolute top-4 right-4 text-sm font-mono text-gray-300">
                00:00:00
            </div>
            
            <h1 class="text-xl font-bold text-center" id="header-title">Citas de Hoy</h1>
            <div class="text-xs text-center text-gray-400 mt-1">
                User ID: <span id="userIdDisplay" class="font-mono">cargando...</span>
            </div>
        </header>

        <!-- Contenido principal (páginas) -->
        <main class="pb-20 p-4">

            <!-- Página 1: Vista Diaria (por defecto) -->
            <div id="page-today" class="space-y-4">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold" id="today-date"></h2>
                    <button id="seed-data" class="bg-blue-500 text-white px-3 py-1 rounded-lg text-sm hover:bg-blue-600">Cargar Datos de Ejemplo</button>
                </div>
                <div id="today-appointments-list" class="space-y-3">
                    <!-- Las citas se cargarán aquí -->
                    <p class="text-gray-500 text-center">No hay citas para hoy.</p>
                </div>
            </div>

            <!-- Página 2: Vista Calendario -->
            <div id="page-calendar" class.="hidden" style="display: none;">
                <!-- Controles de navegación del calendario -->
                <div class="flex justify-between items-center mb-4">
                    <button id="prev-month" class="p-2 rounded-lg hover:bg-gray-200">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                    </button>
                    <h2 id="current-month-year" class="text-lg font-semibold"></h2>
                    <button id="next-month" class="p-2 rounded-lg hover:bg-gray-200">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </button>
                </div>
                
                <!-- Grid del calendario -->
                <div class="grid grid-cols-7 gap-1 text-center font-medium text-gray-500 text-sm mb-2">
                    <div>Do</div>
                    <div>Lu</div>
                    <div>Ma</div>
                    <div>Mi</div>
                    <div>Ju</div>
                    <div>Vi</div>
                    <div>Sá</div>
                </div>
                <div id="calendar-grid" class="grid grid-cols-7 gap-1">
                    <!-- Los días del calendario se cargarán aquí -->
                </div>
            </div>

            <!-- Página 3: Vista Dashboard -->
            <div id="page-dashboard" class="hidden space-y-4" style="display: none;">
                <h2 class="text-lg font-semibold">Dashboard de Rendimiento</h2>
                
                <!-- Selector de Rango de Fechas -->
                <div class="flex gap-2">
                    <div class="flex-1">
                        <label for="start-date" class="text-sm font-medium text-gray-700">Desde</label>
                        <input type="date" id="start-date" class="w-full mt-1 p-2 border rounded-lg focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div class="flex-1">
                        <label for="end-date" class="text-sm font-medium text-gray-700">Hasta</label>
                        <input type="date" id="end-date" class="w-full mt-1 p-2 border rounded-lg focus:ring-blue-500 focus:border-blue-500">
                    </div>
                </div>

                <!-- KPIs -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-blue-50 p-4 rounded-lg shadow">
                        <div class="text-sm text-blue-800">Cortes Realizados</div>
                        <div id="kpi-total-cuts" class="text-2xl font-bold text-blue-900">0</div>
                    </div>
                    <div class="bg-green-50 p-4 rounded-lg shadow">
                        <div class="text-sm text-green-800">Ganancias</div>
                        <div id="kpi-total-earnings" class="text-2xl font-bold text-green-900">$0</div>
                    </div>
                    <div class="bg-yellow-50 p-4 rounded-lg shadow">
                        <div class="text-sm text-yellow-800">Citas Pendientes</div>
                        <div id="kpi-pending-cuts" class="text-2xl font-bold text-yellow-900">0</div>
                    </div>
                    <div class="bg-purple-50 p-4 rounded-lg shadow">
                        <div class="text-sm text-purple-800">Tiempo Prom. (min)</div>
                        <div id="kpi-avg-time" class="text-2xl font-bold text-purple-900">0</div>
                    </div>
                </div>
            </div>

        </main>

        <!-- Navegación inferior fija -->
        <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-200 flex justify-around p-2">
            <button data-page="today" class="nav-btn p-2 rounded-lg text-blue-500">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mx-auto"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path><path d="M8 14h.01"></path><path d="M12 14h.01"></path><path d="M16 14h.01"></path><path d="M8 18h.01"></path><path d="M12 18h.01"></path><path d="M16 18h.01"></path></svg>
                <span class="text-xs">Hoy</span>
            </button>
            <button data-page="calendar" class="nav-btn p-2 rounded-lg text-gray-500">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mx-auto"><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M16 2v4"></path><path d="M8 2v4"></path><path d="M3 10h18"></path></svg>
                <span class="text-xs">Calendario</span>
            </button>
            <button data-page="dashboard" class="nav-btn p-2 rounded-lg text-gray-500">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mx-auto"><path d="M3 3v18h18"></path><path d="m19 9-5 5-4-4-3 3"></path></svg>
                <span class="text-xs">Dashboard</span>
            </button>
        </nav>
    </div>

    <!-- Modulo para imports de Firebase -->
    <script type="module">
        // Importaciones de Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            onSnapshot, 
            addDoc, 
            getDocs,
            Timestamp,
            query,
            where,
            doc, // <-- AÑADIDO
            updateDoc // <-- AÑADIDO
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        // --- CONFIGURACIÓN DE FIREBASE (Usa variables globales) ---
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-barber-app';
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let db, auth, userId;
        let allAppointments = []; // Caché local de todas las citas
        let currentDisplayDate = new Date(); // Para el calendario
        let currentSelectedDate = new Date(); // Para la vista "Hoy"
        let timerStates = new Map(); // <-- AÑADIDO: Para manejar estado de cronómetros

        // --- INICIALIZACIÓN DE LA APP ---
        
        async function initApp() {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                // Autenticación
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        userId = user.uid;
                        document.getElementById('userIdDisplay').textContent = userId;
                        // Ya estamos autenticados, empezamos a escuchar citas
                        listenToAppointments();
                    }
                });

                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }

                // Configuración inicial de las vistas
                setupNavigation();
                setupCalendar();
                setupDashboard();
                setupTodayView();
                setupActionListeners(); // <-- AÑADIDO: Listener para acciones

                document.getElementById('seed-data').addEventListener('click', seedMockData);

                setInterval(updateClockAndTimers, 1000); // <-- MODIFICADO: Intervalo para reloj y cronómetros

            } catch (error) {
                console.error("Error al inicializar Firebase:", error);
                document.getElementById('header-title').textContent = "Error de Conexión";
            }
        }

        // --- LÓGICA DE NAVEGÁCIÓN ---


        function setupNavigation() {
            const navButtons = document.querySelectorAll('.nav-btn');
            const pages = {
                today: document.getElementById('page-today'),
                calendar: document.getElementById('page-calendar'),
                dashboard: document.getElementById('page-dashboard')
            };
            const titles = {
                today: 'Citas de Hoy',
                calendar: 'Calendario',
                dashboard: 'Dashboard'
            };

            navButtons.forEach(button => {
                button.addEventListener('click', () => {
                    const pageName = button.dataset.page;

                    // Ocultar todas las páginas
                    Object.values(pages).forEach(page => page.style.display = 'none');
                    
                    // Mostrar la página seleccionada
                    pages[pageName].style.display = 'block';

                    // Actualizar el título
                    document.getElementById('header-title').textContent = titles[pageName];

                    // Actualizar estilos de botones
                    navButtons.forEach(btn => btn.classList.replace('text-blue-500', 'text-gray-500'));
                    button.classList.replace('text-gray-500', 'text-blue-500');

                    // Refrescar vistas por si los datos cambiaron
                    if (pageName === 'calendar') renderCalendar(currentDisplayDate);
                    if (pageName === 'dashboard') updateDashboard();
                    // CORRECCIÓN: '===Next:' cambiado a '=== 'today''
                    if (pageName === 'today') {
                        currentSelectedDate = new Date(); // Resetea al día de "Hoy"
                        setupTodayView(); // Actualiza el título
                        renderTodayView(allAppointments); // Re-renderiza
                    }
                });
            });
        }

        // --- MANEJO DE ACCIONES DE CITAS ---

        function setupActionListeners() {
            const listElement = document.getElementById('today-appointments-list');
            
            listElement.addEventListener('click', (e) => {
                const card = e.target.closest('.appointment-card');
                if (!card) return;

                const actionButton = e.target.closest('.action-btn');

                if (actionButton) {
                    // Se hizo clic en un botón de acción
                    e.stopPropagation(); // Detener la propagación para no cerrar el menú
                    const action = actionButton.dataset.action;
                    const id = actionButton.dataset.id;
                    handleAppointmentAction(action, id);
                } else {
                    // Se hizo clic en la tarjeta
                    toggleActionsMenu(card);
                }
            });
        }

        function toggleActionsMenu(clickedCard) {
            const actions = clickedCard.querySelector('.appointment-actions');
            if (!actions) return;

            const isHidden = actions.classList.contains('hidden');

            // Ocultar todos los menús de acción
            document.querySelectorAll('.appointment-actions').forEach(menu => {
                if (menu !== actions) {
                    menu.classList.add('hidden');
                    menu.classList.remove('flex');
                }
            });

            // Mostrar/ocultar el menú actual
            actions.classList.toggle('hidden');
            actions.classList.toggle('flex');
        }

        // --- MODIFICADO: Funciones de Cronómetro y Reloj ---
        
        // Nueva función solo para formatear milisegundos a MM:SS
        function formatMilliseconds(totalMilliseconds) {
            const totalSeconds = Math.floor(totalMilliseconds / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            
            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        // Renombrada: esta función ahora solo CALCULA el tiempo transcurrido
        function getElapsedTimeMs(elapsedTime, startTime, status) {
            let totalMilliseconds = elapsedTime || 0;
            if (status === 'in-progress' && startTime) {
                totalMilliseconds += (Date.now() - startTime);
            }
            return totalMilliseconds;
        }

        function updateClockAndTimers() {
            // 1. Actualizar Reloj Principal
            const now = new Date();
            const timeStr = now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const clockElement = document.getElementById('current-time-clock');
            if (clockElement) {
                clockElement.textContent = timeStr;
            }

            // 2. Actualizar Cronómetros
            // Solo actualiza si la vista "Hoy" está visible
            if (document.getElementById('page-today').style.display !== 'block') {
                return;
            }

            document.querySelectorAll('.timer-display').forEach(timerEl => {
                const id = timerEl.dataset.id;
                const state = timerStates.get(id);
                
                // La lógica de actualización ahora está aquí:
                if (state) {
                    // Calcula el tiempo transcurrido CADA SEGUNDO
                    const elapsedMs = getElapsedTimeMs(state.elapsedTime, state.startTime, state.status);
                    timerEl.textContent = formatMilliseconds(elapsedMs);
                    
                    // Asegurarnos de que el color es correcto (verde si 'in-progress', amarillo si 'paused')
                    if (state.status === 'in-progress') {
                        timerEl.classList.remove('text-yellow-700');
                        timerEl.classList.add('text-green-700');
                    } else {
                        timerEl.classList.remove('text-green-700');
                        timerEl.classList.add('text-yellow-700');
                    }
                }
            });
        }
        // --- Fin Funciones de Cronómetro ---

        async function handleAppointmentAction(action, id) { // <-- Convertido a async
            const appointmentRef = doc(db, getAppointmentsCollection().path, id);
            const state = timerStates.get(id) || { elapsedTime: 0 };
            const now = Date.now();
            
            console.log(`Acción: ${action}, Cita ID: ${id}`);
            let simulationMessage = '';

            try {
                switch (action) {
                    case 'call':
                        const appointment = allAppointments.find(a => a.id === id);
                        console.log(`Llamando a ${appointment.customerName} al ${appointment.phone}`);
                        if (appointment.phone) {
                            // window.location.href = `tel:${appointment.phone}`; // Descomentar para producción
                            simulationMessage = `Simulando llamada a: ${appointment.phone}`;
                        } else {
                            simulationMessage = 'Este cliente no tiene un número de teléfono registrado.';
                        }
                        break;
                    case 'start':
                        await updateDoc(appointmentRef, { 
                            status: 'in-progress', 
                            startTime: Timestamp.now(), 
                            elapsedTime: 0 
                        });
                        simulationMessage = 'Corte iniciado';
                        break;
                    case 'pause':
                        const newElapsedTime = (state.elapsedTime || 0) + (now - (state.startTime || now));
                        await updateDoc(appointmentRef, { 
                            status: 'paused', 
                            elapsedTime: newElapsedTime, 
                            startTime: null 
                        });
                        simulationMessage = 'Corte pausado';
                        break;
                    case 'resume':
                        await updateDoc(appointmentRef, { 
                            status: 'in-progress', 
                            startTime: Timestamp.now(), 
                            elapsedTime: state.elapsedTime || 0 
                        });
                        simulationMessage = 'Corte reanudado';
                        break;
                    case 'finish':
                        await updateDoc(appointmentRef, { 
                            status: 'completed', 
                            startTime: null, 
                            elapsedTime: 0 // Resetea el tiempo
                        });
                        simulationMessage = 'Corte finalizado';
                        break;
                    case 'reschedule':
                        simulationMessage = 'Abriendo UI para re-agendar...';
                        break;
                    case 'cancel':
                        await updateDoc(appointmentRef, {
                            status: 'cancelled',
                            // Opcionalmente, podrías borrar el doc: await deleteDoc(appointmentRef);
                        });
                        simulationMessage = 'Cita cancelada';
                        break;
                }
            } catch (error) {
                console.error("Error al actualizar la cita: ", error);
                simulationMessage = "Error al ejecutar la acción.";
            }
            
            if (simulationMessage) {
                console.log(simulationMessage);
            }
            
            // No necesitamos re-renderizar manualmente
            // onSnapshot() detectará el cambio y lo hará por nosotros.
        }


        // --- LÓGICA DE DATOS (FIRESTORE) ---

        function getAppointmentsCollection() {
            // Usamos una colección pública compartida para este prototipo
            // En producción, esto podría ser /barbershops/{shopId}/appointments
            return collection(db, `artifacts/${appId}/public/data/appointments`);
        }

        function listenToAppointments() {
            const appointmentsCol = getAppointmentsCollection();
            
            // Escuchamos cambios en tiempo real
            onSnapshot(appointmentsCol, (snapshot) => {
                allAppointments = snapshot.docs.map(doc => {
                    const data = doc.data();
                    const apt = {
                        id: doc.id,
                        ...data,
                        // Convertimos Timestamp de Firestore a Date de JS
                        dateTime: data.dateTime.toDate(),
                        startTime: data.startTime ? data.startTime.toDate() : null // AÑADIDO
                    };

                    // Actualizar el mapa de estado de cronómetros
                    if (apt.status === 'in-progress' || apt.status === 'paused') {
                        timerStates.set(apt.id, {
                            status: apt.status,
                            startTime: apt.startTime ? apt.startTime.getTime() : null,
                            elapsedTime: apt.elapsedTime || 0
                        });
                    } else {
                        timerStates.delete(apt.id);
                    }
                    
                    return apt;
                });
                
                // Filtramos las canceladas
                allAppointments = allAppointments.filter(apt => apt.status !== 'cancelled');
                
                // Ordenar citas por fecha
                allAppointments.sort((a, b) => a.dateTime - b.dateTime);

                // Actualizar las vistas que dependen de estos datos
                renderTodayView(allAppointments);
                renderCalendar(currentDisplayDate); // Re-renderizar calendario con marcadores
                updateDashboard(); // Actualizar KPIs
            }, (error) => {
                console.error("Error al escuchar citas: ", error);
            });
        }

        // --- VISTA HOY ---

        function setupTodayView() {
            const options = { weekday: 'long', day: 'numeric', month: 'long' };
            document.getElementById('today-date').textContent = currentSelectedDate.toLocaleDateString('es-ES', options);

            // Cambiar título principal si no es hoy
            const today = new Date();
            const headerTitle = document.getElementById('header-title');
            if (currentSelectedDate.toDateString() === today.toDateString()) {
                headerTitle.textContent = "Citas de Hoy";
            } else {
                headerTitle.textContent = currentSelectedDate.toLocaleDateString('es-ES', { day: 'numeric', month: 'long' });
            }
        }

        function renderTodayView(appointments) {
            const todayAppointments = appointments.filter(apt => 
                apt.dateTime.getDate() === currentSelectedDate.getDate() &&
                apt.dateTime.getMonth() === currentSelectedDate.getMonth() &&
                apt.dateTime.getFullYear() === currentSelectedDate.getFullYear()
            );

            const listElement = document.getElementById('today-appointments-list');
            listElement.innerHTML = ''; // Limpiar lista

            if (todayAppointments.length === 0) {
                listElement.innerHTML = '<p class="text-gray-500 text-center">No hay citas para hoy.</p>';
                return;
            }

            todayAppointments.forEach(apt => {
                const card = document.createElement('div');
                // AÑADIR: 'appointment-card', 'relative' y 'cursor-pointer'
                card.className = 'appointment-card bg-white p-4 rounded-lg shadow border border-gray-200 flex items-center space-x-4 relative cursor-pointer hover:shadow-md transition-shadow';
                
                // --- MODIFICACIÓN: Cálculo de hora de fin ---
                const timeStr = apt.dateTime.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
                const endTime = new Date(apt.dateTime.getTime() + apt.duration * 60000);
                const endTimeStr = endTime.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
                // --- Fin Modificación ---

                // --- Lógica de Acciones Dinámicas ---
                let actionsHtml = '';
                // Clases base para los mini-botones de acción
                const baseBtnClass = 'action-btn p-2 rounded-full shadow-lg text-white transition-transform duration-150 ease-in-out';
                const btnData = `data-id="${apt.id}"`;

                switch (apt.status) {
                    case 'pending':
                        actionsHtml = `
                            <button ${btnData} data-action="start" class="${baseBtnClass} bg-green-500 hover:bg-green-600" title="Iniciar Corte">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" class="pointer-events-none"><path d="M11.596 8.697l-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393z"/></svg>
                            </button>
                            <button ${btnData} data-action="reschedule" class="${baseBtnClass} bg-blue-500 hover:bg-blue-600" title="Re-agendar">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" class="pointer-events-none"><path d="M11 6.5a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5v-1z"/><path d="M3.5 0a.5.5 0 0 1 .5.5V1h8V.5a.5.5 0 0 1 1 0V1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h1V.5a.5.5 0 0 1 .5-.5zM1 4v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V4H1z"/></svg>
                            </button>
                            <button ${btnData} data-action="call" class="${baseBtnClass} bg-gray-500 hover:bg-gray-600" title="Llamar Cliente">

                const timerState = timerStates.get(apt.id);

                const initialElapsedMs = timerState ? getElapsedTimeMs(timerState.elapsedTime, timerState.startTime, timerState.status) : 0;

        // --- VISTA CALENDARIO ---

        function setupCalendar() {
            document.getElementById('prev-month').addEventListener('click', () => {
                currentDisplayDate.setMonth(currentDisplayDate.getMonth() - 1);
                renderCalendar(currentDisplayDate);
            });
            document.getElementById('next-month').addEventListener('click', () => {
                currentDisplayDate.setMonth(currentDisplayDate.getMonth() + 1);
                renderCalendar(currentDisplayDate);
            });
            renderCalendar(currentDisplayDate);
        }

        function renderCalendar(date) {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';
            
            const month = date.getMonth();
            const year = date.getFullYear();

            // Actualizar título del mes
            const monthYearString = date.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
            document.getElementById('current-month-year').textContent = monthYearString.charAt(0).toUpperCase() + monthYearString.slice(1);

            const firstDayOfMonth = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const today = new Date();

            // Días del mes anterior (padding)
            for (let i = 0; i < firstDayOfMonth; i++) {
                const dayCell = document.createElement('div');
                dayCell.className = 'p-2 text-center text-gray-300';
                grid.appendChild(dayCell);
            }

            // Días del mes actual
            for (let day = 1; day <= daysInMonth; day++) {
                const dayCell = document.createElement('div');
                dayCell.className = 'p-2 text-center rounded-full cursor-pointer hover:bg-gray-100';
                dayCell.textContent = day;

                const currentDate = new Date(year, month, day);

                // Marcar hoy
                if (day === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
                    dayCell.classList.add('today');
                }

                // Marcar días con citas
                const hasApt = allAppointments.some(apt => 
                    apt.dateTime.getDate() === day &&
                    apt.dateTime.getMonth() === month &&
                    apt.dateTime.getFullYear() === year
                );
                if (hasApt) {
                    dayCell.classList.add('has-appointment');
                }
                
                dayCell.addEventListener('click', () => {
                    // Acción al hacer clic: ir a la vista diaria de ese día
                    currentSelectedDate = currentDate;
                    
                    // Simular clic en la pestaña "Hoy" para cambiar de vista
                    const todayNavButton = document.querySelector('button[data-page="today"]');
                    todayNavButton.click();

                    // Actualizar la vista de "Hoy" con la fecha seleccionada
                    setupTodayView();
                    renderTodayView(allAppointments);
                });

                grid.appendChild(dayCell);
            }
        }

        // --- VISTA DASHBOARD ---

        function setupDashboard() {
            const startDateInput = document.getElementById('start-date');
            const endDateInput = document.getElementById('end-date');

            // Set default dates (hoy)
            const todayStr = new Date().toISOString().split('T')[0];
            startDateInput.value = todayStr;
            endDateInput.value = todayStr;

            startDateInput.addEventListener('change', updateDashboard);
            endDateInput.addEventListener('change', updateDashboard);

            updateDashboard();
        }

        function updateDashboard() {
            const startDate = new Date(document.getElementById('start-date').value + 'T00:00:00');
            const endDate = new Date(document.getElementById('end-date').value + 'T23:59:59');

            if (isNaN(startDate) || isNaN(endDate)) return; // No calcular si las fechas son inválidas

            const filteredAppointments = allAppointments.filter(apt => 
                apt.dateTime >= startDate && apt.dateTime <= endDate
            );

            const completed = filteredAppointments.filter(apt => apt.status === 'completed');
            const pending = filteredAppointments.filter(apt => apt.status === 'pending');

            // 1. Total Cortes Realizados
            const totalCuts = completed.length;
            document.getElementById('kpi-total-cuts').textContent = totalCuts;

            // 2. Ganancias Totales
            const totalEarnings = completed.reduce((sum, apt) => sum + apt.price, 0);
            document.getElementById('kpi-total-earnings').textContent = `$${totalEarnings.toLocaleString('es-ES')}`;

            // 3. Citas Pendientes
            const pendingCuts = pending.length;
            document.getElementById('kpi-pending-cuts').textContent = pendingCuts;

            // 4. Tiempo Promedio
            const totalDuration = completed.reduce((sum, apt) => sum + apt.duration, 0);
            const avgTime = totalCuts > 0 ? (totalDuration / totalCuts).toFixed(0) : 0;
            document.getElementById('kpi-avg-time').textContent = avgTime;
        }
